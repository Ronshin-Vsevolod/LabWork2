name: C++ CI with Makefile and Google Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - repository_design

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev

      - name: Build project
        run: |
          make clean
          make test

      - name: Run tests
        continue-on-error: true
        timeout-minutes: 5
        run: |
          ./test-game < /dev/null || echo "Tests completed with some failures"
